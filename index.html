<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071A24" />
    <meta
      name="description"
      content="Asset Oracle — Real-world data. Smarter decisions. Global insights, market trends, and on-chain data."
    />
    <link rel="canonical" href="https://assetoracleapp.xyz/" />
    <link rel="icon" type="image/svg+xml" href="/asset-oracle-logo-transparent.svg" />
    <link rel="apple-touch-icon" href="/asset-oracle-logo.png" />

    <!-- Open Graph: read directly from the initial HTML by social crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Asset Oracle" />
    <meta property="og:title" content="Asset Oracle | Real-World Data. Smarter Decisions." />
    <meta
      property="og:description"
      content="Global insights, market trends, and on-chain data. Explore Asset Oracle."
    />
    <meta property="og:url" content="https://assetoracleapp.xyz/" />
    <meta
      property="og:image"
      content="https://images.weserv.nl/?url=assetoracleapp.xyz%2Fasset-oracle-social-preview.png&amp;w=1200&amp;h=630&amp;fit=cover&amp;output=jpg&amp;q=78&amp;v=20261030-mobile-action-row"
    />
    <meta
      property="og:image:secure_url"
      content="https://images.weserv.nl/?url=assetoracleapp.xyz%2Fasset-oracle-social-preview.png&amp;w=1200&amp;h=630&amp;fit=cover&amp;output=jpg&amp;q=78&amp;v=20261014"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Asset Oracle — Real-World Data. Smarter Decisions." />

    <!-- X/Twitter card metadata. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asset Oracle | Real-World Data. Smarter Decisions." />
    <meta
      name="twitter:description"
      content="Global insights, market trends, and on-chain data. Explore Asset Oracle."
    />
    <meta
      name="twitter:image"
      content="https://images.weserv.nl/?url=assetoracleapp.xyz%2Fasset-oracle-social-preview.png&amp;w=1200&amp;h=630&amp;fit=cover&amp;output=jpg&amp;q=78&amp;v=20261014"
    />
    <meta name="twitter:image:alt" content="Asset Oracle — Real-World Data. Smarter Decisions." />
    <title>Asset Oracle | Real-World Data. Smarter Decisions.</title>

    <style id="asset-oracle-domain-mobile-layout">
      /* Critical mobile layout fallback is inline so it does not depend on the
         separately cached application stylesheet. Desktop layout is unchanged. */
      @media screen and (max-width: 768px) {
        html, body, #root { width: 100%; max-width: 100%; overflow-x: clip; }
        .app { width: 100% !important; max-width: 100% !important; min-width: 0 !important; padding-left: 12px !important; padding-right: 12px !important; }
        .markets-section, .page-section, .market-grid, .market-card { box-sizing: border-box !important; min-width: 0 !important; max-width: 100% !important; }
        .markets-section .market-grid, .market-grid { display: grid !important; grid-template-columns: minmax(0, 1fr) !important; width: 100% !important; }
        .market-grid > .market-card { width: 100% !important; }
        .market-card.market-card-compact .market-card-bottom {
          display: flex !important; flex-direction: column !important; align-items: flex-start !important;
          justify-content: flex-start !important; gap: 12px !important; width: 100% !important;
        }
        .market-card.market-card-compact .market-card-bottom > .market-status-note {
          display: block !important; width: 100% !important; max-width: 100% !important;
          min-width: 0 !important; white-space: normal !important; overflow-wrap: anywhere !important;
          line-height: 1.5 !important;
        }
        .market-card.market-card-compact .market-card-bottom > .open-market-button,
        .market-card.market-card-compact .market-card-bottom > .verify-market-button {
          display: inline-flex !important; align-self: flex-start !important; flex: 0 1 auto !important;
          width: auto !important; min-width: 0 !important; max-width: 100% !important;
          margin: 0 !important; white-space: normal !important;
        }
      }
    </style>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
