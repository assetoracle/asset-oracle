name: RainbowKit Wagmi 2 remediation experiment

on:
  push:
    branches: [rainbowkit-wagmi2-remediation-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing RainbowKit and Wagmi 2 setup
        run: npm install --no-audit --no-fund
      - name: Record baseline audit
        run: |
          npm audit --json > audit-before.json || true
          node -e "const a=require('./audit-before.json'); console.log('BASELINE', JSON.stringify(a.metadata?.vulnerabilities))"
      - name: Apply npm-supported non-breaking fixes only
        run: |
          npm audit fix --no-fund || true
          npm ls --depth=0
          echo "=== Reown dependency path after safe fixes ==="
          npm explain @reown/appkit || true
          echo "=== Zod dependency paths after safe fixes ==="
          npm explain zod || true
      - name: Record post-fix audit
        run: |
          npm audit --json > audit-after.json || true
          node -e "const a=require('./audit-after.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:v.via.map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable,nodes:v.nodes}))},null,2))" > audit-after-summary.json
          cat audit-after-summary.json
      - name: Build application
        run: npm run build
      - name: Upload experimental lockfile and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainbowkit-wagmi2-remediation-diagnostics
          path: |
            package-lock.json
            audit-before.json
            audit-after.json
            audit-after-summary.json
