name: Asset Oracle Build Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: asset-oracle-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and Build Asset Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify essential files
        run: |
          files=(
            "package.json"
            "index.html"
            "tsconfig.json"
            "tsconfig.app.json"
            "tsconfig.node.json"
            "vite.config.ts"
            "src/main.tsx"
            "src/App.tsx"
            "src/wallet.ts"
            "src/style.css"
            "src/markets/validateMarket.ts"
            "src/data/marketSourceUtils.ts"
            "src/components/MarketDetailPage.tsx"
            "src/components/MarketSourcePanel.tsx"
            "src/components/BitcoinPriceCard.tsx"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING FILE: $file"
              exit 1
            fi
            echo "FOUND: $file"
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify wallet exports
        run: |
          grep -q "export async function connectWallet" src/wallet.ts
          grep -q "export async function switchToAssetChainTestnet" src/wallet.ts
          grep -q "export const ASSET_CHAIN_TESTNET" src/wallet.ts
          echo "Wallet exports verified."

      - name: Verify market source utility
        run: |
          grep -q "export function findMarketSource" src/data/marketSourceUtils.ts
          echo "Market source utility verified."

      - name: Run unit tests
        run: npm test

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build