name: Asset Oracle Frontend Branch Quality Gate

# Supports both push-based checks and manual workflow_dispatch runs.

on:
  push:
    branches:
      - align-market-manager-interface
      - dependency-security-review
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Run frontend production build
        run: npm run build
      - name: Audit frontend dependencies
        run: |
          npm audit --json > frontend-audit.json || audit_status=$?
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("frontend-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities || {};
            console.log("Dependency audit totals:", JSON.stringify(counts));
            for (const [name, issue] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                name,
                severity: issue.severity,
                direct: issue.isDirect,
                range: issue.range,
                fixAvailable: issue.fixAvailable
              }));
            }
            if ((counts.high || 0) > 0 || (counts.critical || 0) > 0) {
              console.error("High or critical dependency advisories remain.");
              process.exit(1);
            }
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-dependency-audit
          path: frontend-audit.json
          if-no-files-found: ignore
