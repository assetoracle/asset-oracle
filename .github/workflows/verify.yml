name: Frontend Verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/dashboard-stats-referral-eligibility
      - feat/connect-referral-frontend
      - fix/reuse-wallet-session-for-publication
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
