name: Frontend Feature Branch Verify

on:
  push:
    branches:
      - feat/dashboard-stats-referral-eligibility
      - feat/connect-referral-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
