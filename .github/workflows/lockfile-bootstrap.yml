name: Temporary lockfile generation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'chore/ci-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Generate package lockfile"
          git push origin ${{ github.event.pull_request.head.ref }}
