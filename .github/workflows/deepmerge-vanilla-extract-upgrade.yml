name: Deepmerge upstream dependency mitigation test

on:
  push:
    branches: [deepmerge-vanilla-extract-upgrade-test]

permissions:
  contents: read

jobs:
  mitigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with upstream vanilla-extract fix
        run: |
          npm install --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = { ...(p.overrides || {}), '@vanilla-extract/css': '1.21.3' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --no-audit --no-fund
      - name: Verify dependency replacement
        run: |
          npm ls @vanilla-extract/css deepmerge --all || true
          node <<'NODE'
          const assert = require('node:assert/strict');
          const css = require('@vanilla-extract/css/package.json');
          assert.equal(css.version, '1.21.3');
          assert.equal(css.dependencies['deepmerge'], undefined);
          assert.ok(css.dependencies['deepmerge-ts']);
          console.log('PASS: @vanilla-extract/css 1.21.3 uses deepmerge-ts, not deepmerge.');
          console.log('deepmerge-ts range:', css.dependencies['deepmerge-ts']);
          NODE
      - name: Build production frontend
        run: npm run build
