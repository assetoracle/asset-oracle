name: Frontend dependency security remediation checks
on:
  push:
    branches:
      - dependency-security-review
    paths:
      - ".github/workflows/bootstrap-dependency-lockfiles.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Regenerate frontend lockfile from declared dependencies
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
      - name: Install frontend exactly from lockfile
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Record remaining frontend advisories
        run: |
          npm audit --json > frontend-audit.json || true
          node -e 'const a=require("./frontend-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))},null,2))'
      - name: Commit lockfile updates after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply compatible frontend dependency security updates"
            git push
          else
            echo "No compatible frontend lockfile updates were available"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: post-remediation-frontend-audit
          path: frontend-audit.json
          if-no-files-found: ignore
