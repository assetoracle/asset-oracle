services:
  - type: web
    name: asset-oracle
    runtime: static
    buildCommand: npm ci && NODE_OPTIONS="--max-old-space-size=4096" npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.walletconnect.com https://*.reown.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://enugu-rpc.assetchain.org https://asset-oracle-backend.onrender.com https://api.coingecko.com https://*.walletconnect.com wss://*.walletconnect.com https://*.reown.com wss://*.reown.com; frame-src 'self' https://*.walletconnect.com https://*.reown.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
